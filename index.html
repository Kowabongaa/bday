<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Kei ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f5efe6; --gold:#ffcf70; --pink:#f4a6c0; --muted:#8a8478; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; background:#000; color:var(--ink);
    font-family:'Inter',sans-serif; text-align:center; overflow-x:hidden;
  }
  body.celebrate { --muted:#dcd0ea; }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:30; }

  /* Lively background (fades in after the cake) */
  .bg {
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    opacity:0; transition:opacity 2.2s ease;
    background:linear-gradient(160deg,#1a0b2e 0%,#2d0f3d 40%,#3b1431 70%,#1c0b22 100%);
  }
  body.celebrate .bg { opacity:1; }
  .blob { position:absolute; border-radius:50%; }
  .b1 { width:70vmax; height:70vmax; top:-30vmax; left:-25vmax;
        background:radial-gradient(circle, rgba(255,95,143,.55) 0%, transparent 65%);
        animation:drift1 18s ease-in-out infinite alternate; }
  .b2 { width:75vmax; height:75vmax; bottom:-35vmax; right:-25vmax;
        background:radial-gradient(circle, rgba(255,179,71,.45) 0%, transparent 65%);
        animation:drift2 22s ease-in-out infinite alternate; }
  .b3 { width:55vmax; height:55vmax; top:25%; left:35%;
        background:radial-gradient(circle, rgba(138,107,255,.45) 0%, transparent 65%);
        animation:drift3 26s ease-in-out infinite alternate; }
  .b4 { width:45vmax; height:45vmax; bottom:5%; left:-15vmax;
        background:radial-gradient(circle, rgba(63,208,181,.3) 0%, transparent 65%);
        animation:drift1 30s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform:translate(25vw,20vh) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-30vw,-15vh) scale(1.2); } }
  @keyframes drift3 { to { transform:translate(-25vw,25vh) scale(.85); } }

  .sparkle {
    position:absolute; width:3px; height:3px; border-radius:50%; background:#fff;
    box-shadow:0 0 6px 2px rgba(255,255,255,.6); opacity:0;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity:0; transform:scale(.5); }
    50%     { opacity:1; transform:scale(1.3); }
  }
  .float-heart {
    position:absolute; bottom:-40px; line-height:1; opacity:0;
    animation:floatUp linear forwards;
  }
  @keyframes floatUp {
    0%   { transform:translateY(0) rotate(0); opacity:0; }
    10%  { opacity:.85; }
    100% { transform:translateY(-115vh) rotate(25deg); opacity:0; }
  }

  /* Stage */
  #stage {
    min-height:100vh; padding:50px 20px; position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  /* Things hidden until the candles are blown out */
  .reveal { display:none; }
  body.celebrate .reveal { display:block; animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pop {
    from { opacity:0; transform:translateY(26px) scale(.95); }
    to   { opacity:1; transform:none; }
  }

  .eyebrow { letter-spacing:.3em; text-transform:uppercase; font-size:.8rem; color:var(--muted); }
  h1 { font-family:'Fraunces',serif; font-size:clamp(2.6rem,9vw,5rem); line-height:1.1; margin:12px 0 10px; }
  .name {
    font-style:italic; font-weight:400;
    background:linear-gradient(90deg,var(--pink),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .heart { display:inline-block; font-size:.8em; animation:beat 1.4s ease-in-out infinite; }
  @keyframes beat {
    0%,100% { transform:scale(1); } 15% { transform:scale(1.2); }
    30% { transform:scale(1); } 45% { transform:scale(1.12); }
  }

  /* Cake */
  .cake-wrap { position:relative; margin:60px auto 0; }
  .glow {
    position:absolute; left:50%; top:-60px; width:420px; height:420px;
    transform:translateX(-50%); pointer-events:none;
    background:radial-gradient(circle, rgba(255,190,90,.28) 0%, rgba(255,150,60,.08) 35%, transparent 65%);
    transition:opacity 1.2s ease; animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity:.75; } }
  .out .glow { opacity:0; animation:none; }

  .cake { position:relative; width:220px; height:190px; cursor:pointer; }
  .plate { position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
           width:270px; height:16px; background:#d9d2c5; border-radius:50%; }
  .layer { position:absolute; left:50%; transform:translateX(-50%); border-radius:12px; }
  .layer.bottom { bottom:0; width:220px; height:72px; background:#f4a6c0; }
  .layer.top { bottom:72px; width:170px; height:62px; background:#fbe3ea; }
  .layer.top::after {
    content:''; position:absolute; left:0; right:0; top:0; height:18px; border-radius:12px 12px 0 0;
    background:radial-gradient(circle at 10px 18px, #fff 9px, transparent 10px) 0 0/20px 26px repeat-x, #fff;
  }
  .candles { position:absolute; bottom:134px; left:50%; transform:translateX(-50%); display:flex; gap:24px; }
  .candle { position:relative; width:10px; height:42px; border-radius:3px;
            background:repeating-linear-gradient(45deg,#fff 0 5px,#ff7a59 5px 10px); }
  .flame {
    position:absolute; top:-24px; left:50%; margin-left:-6px; width:12px; height:20px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; transform-origin:bottom center;
    background:radial-gradient(circle at 50% 70%, #fff8d0, var(--gold) 50%, #ff7a59);
    box-shadow:0 0 22px 6px rgba(255,200,100,.55);
    animation:flicker .15s infinite alternate; transition:opacity .35s, transform .35s;
  }
  @keyframes flicker { to { transform:scale(1.06,.9) rotate(3deg); } }
  .out .flame { opacity:0; transform:scale(.2) translateY(-12px); animation:none; }
  .smoke {
    position:absolute; top:-20px; left:50%; width:10px; height:10px; margin-left:-5px;
    border-radius:50%; background:rgba(210,210,210,.5); filter:blur(3px); opacity:0;
  }
  .out .smoke { animation:smoke 1.8s ease-out forwards; }
  .out .smoke.s2 { animation-delay:.25s; }
  @keyframes smoke {
    0%   { opacity:.6; transform:translateY(0) scale(.6); }
    100% { opacity:0;  transform:translate(8px,-70px) scale(2); }
  }

  .hint { margin-top:44px; color:var(--muted); font-size:.95rem; min-height:1.4em; animation:fade 2.4s ease-in-out infinite; }
  @keyframes fade { 50% { opacity:.4; } }
  body.celebrate .hint { animation:none; }

  /* Message card */
  .card {
    margin-top:30px; max-width:600px; padding:28px; border-radius:18px; line-height:1.75; font-size:1.05rem;
    background:rgba(20,8,30,.45); border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  body.celebrate .card { animation-delay:.5s; }
  .from { margin-top:14px; font-family:'Fraunces',serif; font-style:italic; color:var(--gold); }

  /* Balloons (appear after) */
  .balloon {
    position:fixed; bottom:-140px; width:50px; height:64px; z-index:0; opacity:.7;
    border-radius:50% 50% 48% 48%; animation:rise linear infinite;
  }
  .balloon::after {
    content:''; position:absolute; top:100%; left:50%;
    width:1px; height:60px; background:rgba(255,255,255,.3);
  }
  @keyframes rise { to { transform:translate(30px,-130vh); } }

  /* Gallery */
  #memories { position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:30px 20px 90px; }
  body.celebrate #memories { animation-delay:.9s; }
  #memories h2 { font-family:'Fraunces',serif; font-size:clamp(1.8rem,5vw,2.6rem); margin-bottom:40px; }
  .gallery {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:34px 26px; padding:0 8px;
  }
  .polaroid {
    --r:0deg; position:relative;
    background:#f7f2ea; padding:10px 10px 34px; border-radius:4px; cursor:zoom-in;
    box-shadow:0 14px 30px rgba(0,0,0,.5);
    opacity:0; transform:translateY(40px) rotate(var(--r));
    transition:transform .5s ease, opacity .6s ease;
  }
  .gallery.show .polaroid { opacity:1; transform:rotate(var(--r)); }
  .gallery.show .polaroid:hover { transform:rotate(0) scale(1.06); z-index:2; }
  .polaroid img {
    display:block; width:100%; aspect-ratio:3/4; object-fit:cover;
    border-radius:2px; background:#e2dbcf;
  }
  .polaroid::before {
    content:''; position:absolute; top:-10px; left:50%; width:70px; height:22px;
    transform:translateX(-50%) rotate(-3deg); background:rgba(255,207,112,.55);
  }
  footer { margin-top:70px; color:var(--muted); font-size:.9rem; }

  /* Lightbox */
  .lightbox {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.95); opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .lightbox.open { opacity:1; pointer-events:auto; }
  #lb-img { display:block; max-width:88vw; max-height:85vh; border-radius:6px; }
  .lb-btn {
    position:absolute; background:rgba(255,255,255,.1); color:var(--ink); border:none;
    width:48px; height:48px; border-radius:50%; font-size:1.8rem; cursor:pointer; line-height:1;
  }
  .lb-btn:hover { background:rgba(255,255,255,.22); }
  .lb-close { top:18px; right:18px; }
  .lb-prev { left:14px; top:50%; transform:translateY(-50%); }
  .lb-next { right:14px; top:50%; transform:translateY(-50%); }
</style>
</head>
<body>
<div class="bg" id="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>
<canvas id="confetti"></canvas>

<section id="stage">
  <div class="reveal" id="title">
    <p class="eyebrow">Today is all about you</p>
    <h1>Happy Birthday,<br><span class="name" id="name"></span> <span class="heart">❤️</span></h1>
  </div>

  <div class="cake-wrap" id="cakeWrap">
    <div class="glow"></div>
    <div class="cake" id="cake" aria-label="Birthday cake, tap to blow out the candles">
      <div class="plate"></div>
      <div class="layer bottom"></div>
      <div class="layer top"></div>
      <div class="candles">
        <div class="candle"><div class="flame"></div><div class="smoke"></div><div class="smoke s2"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div><div class="smoke s2"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div><div class="smoke s2"></div></div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">Make a wish, then tap the cake</p>

  <div class="card reveal">
    <p id="message"></p>
    <p class="from" id="from"></p>
  </div>
</section>

<section id="memories" class="reveal">
  <h2>A few favorite moments</h2>
  <div class="gallery" id="gallery"></div>
  <footer>Here's to many more adventures together ✨</footer>
</section>

<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close">×</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next">›</button>
</div>

<script>
  /* ====== EDIT THESE ====== */
  const CONFIG = {
    name: "Kei",
    message: "Happy birthday to my favorite person. I hope this year brings you joy, good food, lots of love and everything you just wished for. I love you and God bless you",
    from: "— Abin",
    photoFolder: "photos",
    photoCount: 22
  };
  /* ======================== */

  document.getElementById('name').textContent = CONFIG.name;
  document.getElementById('message').textContent = CONFIG.message;
  document.getElementById('from').textContent = CONFIG.from;

  const colors = ['#ff7a59','#ffcf70','#c9b8ff','#7ee0c3','#f4a6c0'];

  // Photos: tries common file types automatically (1.jpg, 1.jpeg, 1.png, 1.JPG...)
  const EXTS = ['jpg','jpeg','png','JPG','JPEG','PNG','webp','heic','HEIC'];
  const gallery = document.getElementById('gallery');
  const liveImgs = () => [...gallery.querySelectorAll('img')];

  for (let n = 1; n <= CONFIG.photoCount; n++) {
    const fig = document.createElement('figure');
    fig.className = 'polaroid';
    fig.style.setProperty('--r', (Math.random() * 8 - 4).toFixed(1) + 'deg');
    const img = document.createElement('img');
    img.alt = 'Photo ' + n;
    let k = 0;
    img.onerror = () => {
      k++;
      if (k < EXTS.length) img.src = `${CONFIG.photoFolder}/${n}.${EXTS[k]}`;
      else { console.warn('Could not find photo', n); fig.remove(); }
    };
    img.src = `${CONFIG.photoFolder}/${n}.${EXTS[0]}`;
    fig.appendChild(img);
    fig.addEventListener('click', () => openLightbox(liveImgs().indexOf(img)));
    gallery.appendChild(fig);
  }

  // Lightbox
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  let current = 0;
  function showPhoto(i) {
    const list = liveImgs();
    if (!list.length) return;
    current = (i + list.length) % list.length;
    lbImg.src = list[current].src;
  }
  function openLightbox(i) { showPhoto(i); lb.classList.add('open'); }
  function closeLightbox() { lb.classList.remove('open'); }
  document.getElementById('lb-close').onclick = closeLightbox;
  document.getElementById('lb-prev').onclick = e => { e.stopPropagation(); showPhoto(current - 1); };
  document.getElementById('lb-next').onclick = e => { e.stopPropagation(); showPhoto(current + 1); };
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
  addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showPhoto(current - 1);
    if (e.key === 'ArrowRight') showPhoto(current + 1);
  });
  let touchX = null;
  lb.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
  lb.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) showPhoto(current + (dx < 0 ? 1 : -1));
    touchX = null;
  });

  // Confetti
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let pieces = [], running = false;
  const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  function burst(x, y, count = 180) {
    for (let i = 0; i < count; i++) {
      pieces.push({
        x, y,
        vx: (Math.random() - .5) * 16,
        vy: -Math.random() * 15 - 4,
        size: Math.random() * 8 + 5,
        color: colors[i % colors.length],
        rot: Math.random() * 6,
        vr: (Math.random() - .5) * .3
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pieces) {
      p.vy += .35; p.vx *= .99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    }
    pieces = pieces.filter(p => p.y < canvas.height + 20);
    if (pieces.length) requestAnimationFrame(tick); else running = false;
  }

  // Balloons
  function launchBalloons() {
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = Math.random() * 100 + 'vw';
      b.style.background = colors[i % colors.length];
      b.style.animationDuration = 10 + Math.random() * 10 + 's';
      b.style.animationDelay = (Math.random() * 6) + 's';
      b.style.scale = 0.6 + Math.random() * 0.7;
      document.body.appendChild(b);
    }
  }

  // Lively background: sparkles + floating hearts
  const bg = document.getElementById('bg');
  function startBackground() {
    for (let i = 0; i < 45; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDuration = (2 + Math.random() * 3) + 's';
      s.style.animationDelay = (Math.random() * 4) + 's';
      bg.appendChild(s);
    }
    setInterval(spawnHeart, 900);
  }
  function spawnHeart() {
    if (document.hidden) return;
    const h = document.createElement('span');
    h.className = 'float-heart';
    h.textContent = '❤\uFE0E';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (12 + Math.random() * 16) + 'px';
    h.style.color = ['#ff7aa2', '#ffcf70', '#f4a6c0'][Math.floor(Math.random() * 3)];
    h.style.animationDuration = (7 + Math.random() * 5) + 's';
    h.addEventListener('animationend', () => h.remove());
    bg.appendChild(h);
  }

  // The big moment
  const cake = document.getElementById('cake');
  const cakeWrap = document.getElementById('cakeWrap');
  const hint = document.getElementById('hint');
  let celebrated = false;

  cake.addEventListener('click', () => {
    if (celebrated) return;
    celebrated = true;
    cakeWrap.classList.add('out');
    hint.textContent = '';

    setTimeout(() => {
      document.body.classList.add('celebrate');
      startBackground();
      const r = cake.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + 20);
      setTimeout(() => { burst(innerWidth * .2, innerHeight * .4, 90); burst(innerWidth * .8, innerHeight * .4, 90); }, 350);
      launchBalloons();
      hint.textContent = 'Scroll down for some memories 📸';

      // drop the polaroids in one by one
      const items = [...gallery.children];
      items.forEach((el, i) => el.style.transitionDelay = (1100 + i * 90) + 'ms');
      requestAnimationFrame(() => requestAnimationFrame(() => gallery.classList.add('show')));
      setTimeout(() => items.forEach(el => el.style.transitionDelay = '0ms'), 1100 + items.length * 90 + 700);
    }, 900);
  });
</script>
</body>
</html>
