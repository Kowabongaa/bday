<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Kei ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,wght@0,600;0,800;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f5efe6; --gold:#ffcf70; --pink:#f4a6c0; --muted:#8a8478; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; background:#000; color:var(--ink);
    font-family:'Inter',sans-serif; text-align:center; overflow-x:hidden;
  }
  body.celebrate { --muted:#dcd0ea; }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:30; }

  /* ---------- Lively background (after the cake) ---------- */
  .bg {
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    opacity:0; transition:opacity 2.2s ease;
    background:linear-gradient(160deg,#1a0b2e 0%,#2d0f3d 40%,#3b1431 70%,#1c0b22 100%);
  }
  body.celebrate .bg { opacity:1; }
  .blob { position:absolute; border-radius:50%; }
  .b1 { width:70vmax; height:70vmax; top:-30vmax; left:-25vmax;
        background:radial-gradient(circle, rgba(255,95,143,.55) 0%, transparent 65%);
        animation:drift1 18s ease-in-out infinite alternate; }
  .b2 { width:75vmax; height:75vmax; bottom:-35vmax; right:-25vmax;
        background:radial-gradient(circle, rgba(255,179,71,.45) 0%, transparent 65%);
        animation:drift2 22s ease-in-out infinite alternate; }
  .b3 { width:55vmax; height:55vmax; top:25%; left:35%;
        background:radial-gradient(circle, rgba(138,107,255,.45) 0%, transparent 65%);
        animation:drift3 26s ease-in-out infinite alternate; }
  .b4 { width:45vmax; height:45vmax; bottom:5%; left:-15vmax;
        background:radial-gradient(circle, rgba(63,208,181,.3) 0%, transparent 65%);
        animation:drift1 30s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform:translate(25vw,20vh) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-30vw,-15vh) scale(1.2); } }
  @keyframes drift3 { to { transform:translate(-25vw,25vh) scale(.85); } }
  .sparkle {
    position:absolute; width:3px; height:3px; border-radius:50%; background:#fff;
    box-shadow:0 0 6px 2px rgba(255,255,255,.6); opacity:0; animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity:0; transform:scale(.5); } 50% { opacity:1; transform:scale(1.3); } }
  .float-heart { position:absolute; bottom:-40px; line-height:1; opacity:0; animation:floatUp linear forwards; }
  @keyframes floatUp {
    0% { transform:translateY(0) rotate(0); opacity:0; } 10% { opacity:.85; }
    100% { transform:translateY(-115vh) rotate(25deg); opacity:0; }
  }

  /* ---------- Stage ---------- */
  #stage {
    min-height:100vh; padding:50px 20px; position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .reveal { display:none; }
  body.celebrate .reveal { display:block; animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both; }
  body.celebrate .pre { display:none; }
  @keyframes pop { from { opacity:0; transform:translateY(26px) scale(.95); } to { opacity:1; transform:none; } }

  .eyebrow { letter-spacing:.3em; text-transform:uppercase; font-size:.8rem; color:var(--muted); }
  h1 { font-family:'Fraunces',serif; font-size:clamp(2.6rem,9vw,5rem); line-height:1.1; margin:12px 0 10px; }
  .name {
    font-style:italic; font-weight:400;
    background:linear-gradient(90deg,var(--pink),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .heart { display:inline-block; font-size:.8em; animation:beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform:scale(1); } 15% { transform:scale(1.2); } 30% { transform:scale(1); } 45% { transform:scale(1.12); } }

  /* ---------- Cake ---------- */
  .cake-wrap { position:relative; margin:40px auto 0; --wind:0; --gust:0; }
  .glow {
    position:absolute; left:50%; top:-190px; width:440px; height:440px;
    transform:translateX(-50%); pointer-events:none;
    background:radial-gradient(circle, rgba(255,190,90,.3) 0%, rgba(255,150,60,.08) 35%, transparent 65%);
    transition:opacity 1.2s ease; animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity:.75; } }
  .out .glow { opacity:0; animation:none; }

  .cake { position:relative; width:300px; height:290px; margin:0 auto; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .plate {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:320px; height:26px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 35%, #ffffff 0%, #e6e1da 55%, #b9b2a8 100%);
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  .tier { position:absolute; left:50%; transform:translateX(-50%); }
  .tier .side { position:absolute; left:0; bottom:0; width:100%; overflow:hidden; }
  .tier .top { position:absolute; left:0; top:0; width:100%; border-radius:50%; z-index:2; }
  .t1 { width:260px; height:106px; bottom:12px; }
  .t1 .side { height:88px; border-radius:0 0 130px 130px / 0 0 18px 18px;
    background:linear-gradient(90deg,#b95b7d 0%,#ee97b5 22%,#f8b9cd 45%,#f2a3be 70%,#c66a8a 100%); }
  .t1 .top { height:36px; background:radial-gradient(ellipse at 45% 40%, #ffffff, #fbeef2 70%, #f1dbe2); }
  .t2 { width:184px; height:82px; bottom:86px; }
  .t2 .side { height:68px; border-radius:0 0 92px 92px / 0 0 14px 14px;
    background:linear-gradient(90deg,#cfb08a 0%,#f6e6cf 25%,#fff7ea 48%,#f1dfc4 72%,#c9a67d 100%); }
  .t2 .top { height:28px; background:radial-gradient(ellipse at 45% 40%, #ffd3e0, #f6aac3 70%, #e994b1); }
  .drip { position:absolute; top:0; border-radius:0 0 10px 10px; }
  .sprinkle { position:absolute; width:3px; height:9px; border-radius:2px; }
  .bead { position:absolute; width:12px; height:12px; border-radius:50%; z-index:3; }

  .candles { position:absolute; bottom:150px; left:50%; transform:translateX(-50%); display:flex; gap:4px; z-index:5; align-items:flex-end; }
  .num-candle { display:flex; flex-direction:column; align-items:center; }
  .digit {
    font-family:'Fraunces',serif; font-weight:800; font-size:78px; line-height:.8;
    background:linear-gradient(180deg,#fff0c2 0%,#ffcf70 45%,#ec9f45 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 #c9853a) drop-shadow(0 6px 10px rgba(0,0,0,.35));
  }
  .wick { width:3px; height:12px; background:#3a2a20; border-radius:2px; margin-bottom:-2px; }
  .flame-holder {
    position:relative; width:20px; height:28px; transform-origin:50% 100%;
    transform:rotate(calc(var(--wind) * 1deg)) scaleY(calc(1 - var(--gust) * .35));
    transition:transform .08s linear;
  }
  .flame {
    position:absolute; bottom:0; left:50%; margin-left:-7px; width:14px; height:24px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; transform-origin:bottom center;
    background:radial-gradient(circle at 50% 70%, #fff8d0, var(--gold) 50%, #ff7a59);
    box-shadow:0 0 24px 8px rgba(255,200,100,.55);
    animation:flicker .15s infinite alternate; transition:opacity .35s, transform .35s;
  }
  @keyframes flicker { to { transform:scale(1.06,.9) rotate(3deg); } }
  .out .flame { opacity:0; transform:scale(.2) translateY(-12px); animation:none; }
  .smoke {
    position:absolute; bottom:4px; left:50%; width:10px; height:10px; margin-left:-5px;
    border-radius:50%; background:rgba(210,210,210,.5); filter:blur(3px); opacity:0;
  }
  .out .smoke { animation:smoke 1.8s ease-out forwards; }
  .out .smoke.s2 { animation-delay:.25s; }
  @keyframes smoke { 0% { opacity:.6; transform:translateY(0) scale(.6); } 100% { opacity:0; transform:translate(8px,-70px) scale(2); } }

  .hint { margin-top:34px; color:var(--muted); font-size:.95rem; animation:fade 2.4s ease-in-out infinite; }
  @keyframes fade { 50% { opacity:.4; } }
  .mic-btn {
    margin-top:18px; padding:12px 22px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(255,207,112,.5); background:rgba(255,207,112,.08);
    color:var(--ink); font:500 .95rem 'Inter',sans-serif;
  }
  .mic-btn.listening { border-color:var(--gold); animation:listen 1.2s ease-in-out infinite; }
  @keyframes listen { 50% { box-shadow:0 0 0 8px rgba(255,207,112,.15); } }
  .small-hint { margin-top:10px; font-size:.8rem; color:#5f5a52; }

  /* ---------- Envelope ---------- */
  .env-box { margin-top:40px; }
  body.celebrate .env-box { animation-delay:.5s; }
  .envelope {
    position:relative; width:280px; height:180px; margin:0 auto; cursor:pointer;
    perspective:900px; animation:wiggle 2.6s ease-in-out 2s infinite;
  }
  @keyframes wiggle { 0%,80%,100% { transform:rotate(0); } 85% { transform:rotate(-3deg); } 90% { transform:rotate(3deg); } 95% { transform:rotate(-2deg); } }
  .envelope.open { animation:none; }
  .env-back { position:absolute; inset:0; background:#d9b994; border-radius:8px; box-shadow:0 20px 40px rgba(0,0,0,.4); }
  .env-paper {
    position:absolute; left:16px; right:16px; top:12px; height:150px; z-index:1; border-radius:4px;
    background:repeating-linear-gradient(#fffaf2 0 22px, #f0e2cf 22px 23px);
    transition:transform .8s ease .45s;
  }
  .env-front {
    position:absolute; inset:0; z-index:2; border-radius:8px; background:#ecd3b4;
    clip-path:polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    position:absolute; left:0; right:0; top:0; height:58%; z-index:3; background:#e2c29c;
    clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top center;
    transition:transform .6s ease, z-index 0s .3s;
  }
  .envelope.open .env-flap { transform:rotateX(180deg); z-index:0; }
  .envelope.open .env-paper { transform:translateY(-95px); }
  .seal {
    position:absolute; left:50%; top:58%; width:42px; height:42px; margin:-21px 0 0 -21px; z-index:4;
    border-radius:50%; background:radial-gradient(circle at 40% 35%,#e0567f,#a8204a); color:#ffd6e2;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow:0 3px 8px rgba(0,0,0,.35); transition:opacity .3s, transform .3s;
  }
  .envelope.open .seal { opacity:0; transform:scale(.6); }
  .env-label { margin-top:18px; color:var(--muted); font-size:.95rem; }

  /* ---------- Letter ---------- */
  .letter {
    display:none; width:100%; max-width:560px; margin:34px auto 0; padding:34px 30px 28px; text-align:left;
    background:linear-gradient(180deg,#fffaf2,#fbf1e2); color:#3b2a2a; border-radius:8px; cursor:pointer;
    box-shadow:0 24px 50px rgba(0,0,0,.45); font-family:'Caveat',cursive; font-size:1.65rem; line-height:1.45;
  }
  .letter.show { display:block; animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both; }
  .greet { font-size:1.95rem; margin-bottom:10px; color:#b0466c; }
  .caret { display:inline-block; width:2px; height:1.1em; background:#b0466c; vertical-align:-.15em; margin-left:2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .sign { text-align:right; margin-top:18px; font-size:1.95rem; color:#b0466c; opacity:0; transform:translateY(8px); transition:.6s; }
  .sign.show { opacity:1; transform:none; }
  .scroll-cue { display:none; margin-top:28px; color:var(--muted); }
  .scroll-cue.show { display:block; animation:bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(6px); } }

  /* ---------- Gallery (uncropped, staggered) ---------- */
  #memories { display:none; position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:30px 20px 90px; }
  #memories.visible { display:block; animation:pop .9s ease both; }
  #memories h2 { font-family:'Fraunces',serif; font-size:clamp(1.8rem,5vw,2.6rem); margin-bottom:40px; }
  .gallery { columns:3 160px; column-gap:24px; padding:0 8px; }
  .polaroid {
    --r:0deg; position:relative; display:inline-block; width:100%; margin:0 0 30px; break-inside:avoid;
    background:#f7f2ea; padding:10px 10px 30px; border-radius:4px; cursor:zoom-in;
    box-shadow:0 14px 30px rgba(0,0,0,.5);
    opacity:0; transform:translateY(40px) rotate(var(--r));
    transition:transform .5s ease, opacity .6s ease;
  }
  .gallery.show .polaroid { opacity:1; transform:rotate(var(--r)); }
  .gallery.show .polaroid:hover { transform:rotate(0) scale(1.05); z-index:2; }
  .polaroid img { display:block; width:100%; height:auto; min-height:100px; border-radius:2px; background:#e2dbcf; }
  .polaroid::before {
    content:''; position:absolute; top:-10px; left:50%; width:70px; height:22px;
    transform:translateX(-50%) rotate(-3deg); background:rgba(255,207,112,.55);
  }

  /* ---------- Surprise ---------- */
  #surprise { margin-top:60px; }
  .gift-btn {
    font:600 1.05rem 'Inter',sans-serif; padding:16px 30px; border-radius:999px; border:none; cursor:pointer;
    color:#2b1430; background:linear-gradient(90deg,var(--pink),var(--gold));
    box-shadow:0 10px 30px rgba(255,150,180,.35); animation:nudge 2s ease-in-out infinite;
  }
  @keyframes nudge { 50% { transform:scale(1.06); } }
  .ticket {
    display:none; max-width:440px; margin:0 auto; padding:30px 26px 26px; border-radius:14px; color:#2b1d1d;
    background:linear-gradient(180deg,#fffaf2,#f8ecda);
    box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 0 0 6px #fffaf2, inset 0 0 0 7px #d9b26a;
  }
  .ticket.show { display:block; animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both; }
  .t-eyebrow { font-size:.75rem; letter-spacing:.25em; text-transform:uppercase; color:#b0466c; font-weight:600; }
  .t-place { font-family:'Fraunces',serif; font-size:clamp(1.6rem,6vw,2.1rem); margin:10px 0 16px; }
  .t-line { border-top:2px dashed #d9c3a0; margin:0 -6px 18px; }
  .t-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .t-row span { display:block; font-size:.68rem; letter-spacing:.15em; text-transform:uppercase; color:#8a7560; margin-bottom:4px; }
  .t-row strong { font-size:1rem; }
  .t-note { margin-top:20px; font-family:'Caveat',cursive; font-size:1.6rem; color:#b0466c; }
  footer { margin-top:70px; color:var(--muted); font-size:.9rem; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.95); opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .lightbox.open { opacity:1; pointer-events:auto; }
  #lb-img { display:block; max-width:88vw; max-height:85vh; border-radius:6px; }
  .lb-btn {
    position:absolute; background:rgba(255,255,255,.1); color:var(--ink); border:none;
    width:48px; height:48px; border-radius:50%; font-size:1.8rem; cursor:pointer; line-height:1;
  }
  .lb-btn:hover { background:rgba(255,255,255,.22); }
  .lb-close { top:18px; right:18px; }
  .lb-prev { left:14px; top:50%; transform:translateY(-50%); }
  .lb-next { right:14px; top:50%; transform:translateY(-50%); }

  @media (max-width:360px) { .cake-wrap { transform:scale(.88); } }
</style>
</head>
<body>
<div class="bg" id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>
<canvas id="confetti"></canvas>

<section id="stage">
  <div class="reveal">
    <p class="eyebrow">Today is all about you</p>
    <h1>Happy Birthday,<br><span class="name" id="name"></span> <span class="heart">❤️</span></h1>
  </div>

  <div class="cake-wrap" id="cakeWrap">
    <div class="glow"></div>
    <div class="cake" id="cake" aria-label="Birthday cake">
      <div class="plate"></div>
      <div class="tier t1"><div class="side"></div><div class="top"></div></div>
      <div class="tier t2"><div class="side"></div><div class="top"></div></div>
      <div class="candles" id="candles"></div>
    </div>
  </div>

  <p class="hint pre" id="hint">Make a wish…</p>
  <button class="mic-btn pre" id="micBtn">🎤 Tap here, then blow out the candles</button>
  <p class="small-hint pre">or just tap the cake</p>

  <div class="env-box reveal" id="envBox">
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-paper"></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal">❤</div>
    </div>
    <p class="env-label">There's a letter for you. Tap to open 💌</p>
  </div>

  <div class="letter" id="letter">
    <p class="greet" id="greet"></p>
    <p><span id="letterBody"></span><span class="caret" id="caret"></span></p>
    <p class="sign" id="sign"></p>
  </div>

  <p class="scroll-cue" id="scrollCue">Scroll down for some memories 📸 ↓</p>
</section>

<section id="memories">
  <h2>A few favorite moments</h2>
  <div class="gallery" id="gallery"></div>

  <div id="surprise">
    <button class="gift-btn" id="giftBtn">One more thing… 🎁</button>
    <div class="ticket" id="ticket">
      <p class="t-eyebrow" id="tHeading"></p>
      <h3 class="t-place" id="tPlace"></h3>
      <div class="t-line"></div>
      <div class="t-row">
        <div><span>Date</span><strong id="tDate"></strong></div>
        <div><span>Time</span><strong id="tTime"></strong></div>
        <div><span>Table</span><strong id="tGuests"></strong></div>
      </div>
      <p class="t-note" id="tNote"></p>
    </div>
  </div>

  <footer>Here's to many more adventures together ✨</footer>
</section>

<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close">×</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next">›</button>
</div>

<script>
  /* ====== EDIT THESE ====== */
  const CONFIG = {
    name: "Kei",
    age: "25",
    message: "Happy birthday to my favorite person. I hope this year brings you joy, good food, love and everything you just wished for. I love you and God bless you.",
    from: "— Abin",
    photoFolder: "photos",
    photoCount: 22,
    surprise: {
      heading: "You have a date 🥂",
      place: "The Grill by A Cut",
      date: "Sat, 28 Nov",
      time: "6:30 PM",
      guests: "For two",
      note: "Wear something nice. It's a date ❤️"
    }
  };
  /* ======================== */

  const $ = id => document.getElementById(id);
  $('name').textContent = CONFIG.name;
  $('greet').textContent = `Dear ${CONFIG.name},`;
  $('sign').textContent = CONFIG.from;
  $('tHeading').textContent = CONFIG.surprise.heading;
  $('tPlace').textContent = CONFIG.surprise.place;
  $('tDate').textContent = CONFIG.surprise.date;
  $('tTime').textContent = CONFIG.surprise.time;
  $('tGuests').textContent = CONFIG.surprise.guests;
  $('tNote').textContent = CONFIG.surprise.note;

  const colors = ['#ff7a59','#ffcf70','#c9b8ff','#7ee0c3','#f4a6c0'];
  const cake = $('cake'), cakeWrap = $('cakeWrap');

  /* ---------- Build the cake ---------- */
  [...CONFIG.age].forEach(d => {
    const c = document.createElement('div');
    c.className = 'num-candle';
    c.innerHTML = `<div class="flame-holder"><div class="flame"></div><div class="smoke"></div><div class="smoke s2"></div></div><div class="wick"></div><div class="digit">${d}</div>`;
    $('candles').appendChild(c);
  });

  function decorateTier(sel, w, e, h, dripColor, beadColor) {
    const tier = document.querySelector(sel), side = tier.querySelector('.side');
    for (let x = 10; x < w - 10; x += 12 + Math.random() * 7) {
      const rel = (x - w / 2) / (w / 2);
      const under = (e / 2) * Math.sqrt(Math.max(0, 1 - rel * rel));
      const dw = 9 + Math.random() * 7;
      const d = document.createElement('span');
      d.className = 'drip';
      d.style.left = (x - dw / 2) + 'px';
      d.style.width = dw + 'px';
      d.style.height = (under + 6 + Math.random() * 24) + 'px';
      d.style.background = dripColor;
      side.appendChild(d);
    }
    for (let i = 0; i < 24; i++) {
      const s = document.createElement('span');
      s.className = 'sprinkle';
      s.style.left = (8 + Math.random() * (w - 16)) + 'px';
      s.style.top = (e / 2 + 14 + Math.random() * (h - e / 2 - 26)) + 'px';
      s.style.background = colors[i % colors.length];
      s.style.transform = `rotate(${Math.random() * 180}deg)`;
      side.appendChild(s);
    }
    for (let x = 6; x <= w - 6; x += 10) {
      const rel = (x - w / 2) / (w / 2);
      const yb = h + (e / 2) * Math.sqrt(Math.max(0, 1 - rel * rel));
      const b = document.createElement('span');
      b.className = 'bead';
      b.style.left = (x - 6) + 'px';
      b.style.top = (yb - 10) + 'px';
      b.style.background = `radial-gradient(circle at 35% 35%, #fff, ${beadColor})`;
      tier.appendChild(b);
    }
  }
  decorateTier('.t1', 260, 36, 88, '#f9ebf0', '#f3d9e2');
  decorateTier('.t2', 184, 28, 68, '#f4a8c1', '#e994b1');

  /* ---------- Photos ---------- */
  const EXTS = ['jpg','jpeg','png','JPG','JPEG','PNG','webp','heic','HEIC'];
  const gallery = $('gallery');
  const liveImgs = () => [...gallery.querySelectorAll('img')];
  for (let n = 1; n <= CONFIG.photoCount; n++) {
    const fig = document.createElement('figure');
    fig.className = 'polaroid';
    fig.style.setProperty('--r', (Math.random() * 6 - 3).toFixed(1) + 'deg');
    const img = document.createElement('img');
    img.alt = 'Photo ' + n;
    let k = 0;
    img.onerror = () => {
      k++;
      if (k < EXTS.length) img.src = `${CONFIG.photoFolder}/${n}.${EXTS[k]}`;
      else { console.warn('Could not find photo', n); fig.remove(); }
    };
    img.src = `${CONFIG.photoFolder}/${n}.${EXTS[0]}`;
    fig.appendChild(img);
    fig.addEventListener('click', () => openLightbox(liveImgs().indexOf(img)));
    gallery.appendChild(fig);
  }

  /* ---------- Lightbox ---------- */
  const lb = $('lightbox'), lbImg = $('lb-img');
  let current = 0;
  function showPhoto(i) {
    const list = liveImgs();
    if (!list.length) return;
    current = (i + list.length) % list.length;
    lbImg.src = list[current].src;
  }
  function openLightbox(i) { showPhoto(i); lb.classList.add('open'); }
  function closeLightbox() { lb.classList.remove('open'); }
  $('lb-close').onclick = closeLightbox;
  $('lb-prev').onclick = e => { e.stopPropagation(); showPhoto(current - 1); };
  $('lb-next').onclick = e => { e.stopPropagation(); showPhoto(current + 1); };
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
  addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showPhoto(current - 1);
    if (e.key === 'ArrowRight') showPhoto(current + 1);
  });
  let touchX = null;
  lb.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
  lb.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) showPhoto(current + (dx < 0 ? 1 : -1));
    touchX = null;
  });

  /* ---------- Confetti ---------- */
  const canvas = $('confetti'), ctx = canvas.getContext('2d');
  let pieces = [], running = false;
  const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  function burst(x, y, count = 180) {
    for (let i = 0; i < count; i++) {
      pieces.push({ x, y, vx:(Math.random() - .5) * 16, vy:-Math.random() * 15 - 4,
        size:Math.random() * 8 + 5, color:colors[i % colors.length], rot:Math.random() * 6, vr:(Math.random() - .5) * .3 });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pieces) {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    }
    pieces = pieces.filter(p => p.y < canvas.height + 20);
    if (pieces.length) requestAnimationFrame(tick); else running = false;
  }

  /* ---------- Lively background ---------- */
  const bg = $('bg');
  function startBackground() {
    for (let i = 0; i < 45; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDuration = (2 + Math.random() * 3) + 's';
      s.style.animationDelay = (Math.random() * 4) + 's';
      bg.appendChild(s);
    }
    setInterval(spawnHeart, 900);
  }
  function spawnHeart() {
    if (document.hidden) return;
    const h = document.createElement('span');
    h.className = 'float-heart';
    h.textContent = '❤\uFE0E';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (12 + Math.random() * 16) + 'px';
    h.style.color = ['#ff7aa2', '#ffcf70', '#f4a6c0'][Math.floor(Math.random() * 3)];
    h.style.animationDuration = (7 + Math.random() * 5) + 's';
    h.addEventListener('animationend', () => h.remove());
    bg.appendChild(h);
  }

  /* ---------- Blow into the mic ---------- */
  const micBtn = $('micBtn');
  let micStream = null, audioCtx = null, micRaf = null;

  function micFail() {
    micBtn.style.display = 'none';
    $('hint').textContent = 'Tap the cake to blow out the candles 🎂';
  }
  function stopMic() {
    if (micRaf) cancelAnimationFrame(micRaf);
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close().catch(() => {});
    micStream = audioCtx = micRaf = null;
    cakeWrap.style.setProperty('--wind', 0);
    cakeWrap.style.setProperty('--gust', 0);
  }

  micBtn.addEventListener('click', async () => {
    if (micStream) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micFail(); return; }
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      audioCtx.createMediaStreamSource(micStream).connect(analyser);
      const data = new Float32Array(analyser.fftSize);

      micBtn.textContent = 'Listening… now blow! 🌬️';
      micBtn.classList.add('listening');

      let frames = 0, baseline = 0, strong = 0;
      const loop = () => {
        analyser.getFloatTimeDomainData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
        const rms = Math.sqrt(sum / data.length);
        frames++;
        if (frames < 20) baseline = Math.max(baseline, rms);
        const threshold = Math.max(0.18, baseline * 3);
        const level = Math.min(1, rms / threshold);
        cakeWrap.style.setProperty('--wind', (level * 22 + (Math.random() * 6 - 3)).toFixed(1));
        cakeWrap.style.setProperty('--gust', level.toFixed(2));
        if (frames >= 20 && rms > threshold) strong++; else strong = Math.max(0, strong - 1);
        if (strong > 8) { blowOut(); return; }
        micRaf = requestAnimationFrame(loop);
      };
      loop();
    } catch (err) {
      stopMic();
      micFail();
    }
  });

  /* ---------- The big moment ---------- */
  let celebrated = false;
  function blowOut() {
    if (celebrated) return;
    celebrated = true;
    stopMic();
    cakeWrap.classList.add('out');
    setTimeout(celebrate, 900);
  }
  function celebrate() {
    document.body.classList.add('celebrate');
    startBackground();
    const r = cake.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + 60);
    setTimeout(() => { burst(innerWidth * .2, innerHeight * .4, 90); burst(innerWidth * .8, innerHeight * .4, 90); }, 350);
  }
  cake.addEventListener('click', blowOut);

  /* ---------- Envelope + letter ---------- */
  const envelope = $('envelope'), letter = $('letter'), body = $('letterBody');
  let typed = 0, typingTimer = null, letterDone = false;

  envelope.addEventListener('click', () => {
    if (envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    setTimeout(() => {
      $('envBox').style.display = 'none';
      letter.classList.add('show');
      setTimeout(typeNext, 500);
    }, 1400);
  });

  function typeNext() {
    const msg = CONFIG.message;
    typed++;
    body.textContent = msg.slice(0, typed);
    if (typed < msg.length) {
      typingTimer = setTimeout(typeNext, /[.,!?]/.test(msg[typed - 1]) ? 280 : 40);
    } else finishLetter();
  }
  letter.addEventListener('click', () => {
    if (letterDone) return;
    clearTimeout(typingTimer);
    typed = CONFIG.message.length;
    body.textContent = CONFIG.message;
    finishLetter();
  });
  function finishLetter() {
    if (letterDone) return;
    letterDone = true;
    $('caret').style.display = 'none';
    $('sign').classList.add('show');
    setTimeout(revealGallery, 700);
  }

  /* ---------- Gallery reveal ---------- */
  function revealGallery() {
    $('memories').classList.add('visible');
    $('scrollCue').classList.add('show');
    const items = [...gallery.children];
    items.forEach((el, i) => el.style.transitionDelay = (300 + i * 80) + 'ms');
    requestAnimationFrame(() => requestAnimationFrame(() => gallery.classList.add('show')));
    setTimeout(() => items.forEach(el => el.style.transitionDelay = '0ms'), 300 + items.length * 80 + 700);
  }

  /* ---------- One more thing ---------- */
  $('giftBtn').addEventListener('click', () => {
    $('giftBtn').style.display = 'none';
    const ticket = $('ticket');
    ticket.classList.add('show');
    ticket.scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(() => {
      const r = ticket.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + 20, 200);
    }, 450);
  });
</script>
</body>
</html>
